<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="100%" height="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#6366f1"/>
    </marker>
  </defs>

  <!-- Clean Canvas Background -->
  <rect width="1200" height="520" fill="#ffffff" rx="8"/>

  <!-- ==================== COLUMN 1: INPUT TELEMETRY (BLUE) ==================== -->
  <!-- Box 1: Flow records -->
  <g transform="translate(20, 60)">
    <rect width="180" height="150" rx="10" fill="#f0f9ff" stroke="#0284c7" stroke-width="2.5"/>
    <text x="90" y="38" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">Flow records</text>
    <text x="90" y="68" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="12" fill="#475569" text-anchor="middle">CTU-13, CIC-IDS2017/18,</text>
    <text x="90" y="88" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="12" fill="#475569" text-anchor="middle">UNSW-NB15, Zeek conn.log</text>
    <text x="90" y="108" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">(format auto-detected)</text>
  </g>

  <!-- Box 2: Packet capture -->
  <g transform="translate(20, 270)">
    <rect width="180" height="150" rx="10" fill="#f0f9ff" stroke="#0284c7" stroke-width="2.5"/>
    <text x="90" y="38" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">Packet capture</text>
    <text x="90" y="68" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="12" fill="#475569" text-anchor="middle">pcap / pcapng</text>
    <text x="90" y="88" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="12" fill="#475569" text-anchor="middle">(Scapy DPI &amp; eBPF XDP)</text>
    <text x="90" y="108" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="12" fill="#0284c7" font-weight="600" text-anchor="middle">~125k pkts/s to 100 Gbps</text>
  </g>

  <!-- Arrow: Box 1 -> Box 3 -->
  <line x1="200" y1="135" x2="238" y2="135" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Arrow: Box 2 -> Box 4 -->
  <line x1="200" y1="345" x2="238" y2="345" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ==================== COLUMN 2: LOADERS & EXTRACTION (MINT GREEN) ==================== -->
  <!-- Box 3: Flow loaders -->
  <g transform="translate(240, 60)">
    <rect width="185" height="150" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/>
    <text x="92" y="38" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="16" font-weight="bold" fill="#064e3b" text-anchor="middle">Flow loaders</text>
    <text x="92" y="68" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="12" fill="#047857" text-anchor="middle">one schema for every dataset:</text>
    <text x="92" y="88" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="12" fill="#334155" text-anchor="middle">flags, bytes, volumes,</text>
    <text x="92" y="108" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="12" fill="#334155" text-anchor="middle">IAT mean/var, host ratios</text>
  </g>

  <!-- Box 4: packet_features -->
  <g transform="translate(240, 270)">
    <rect width="185" height="150" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/>
    <text x="92" y="38" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="16" font-weight="bold" fill="#064e3b" text-anchor="middle">packet_features</text>
    <text x="92" y="68" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="12" fill="#334155" text-anchor="middle">TTL &amp; session variance,</text>
    <text x="92" y="88" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="12" fill="#334155" text-anchor="middle">TCP window, fragments,</text>
    <text x="92" y="108" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="12" fill="#334155" text-anchor="middle">port scans, East-West pivot</text>
  </g>

  <!-- Arrow: Box 3 -> State S_t (with "window" label) -->
  <path d="M 425 135 L 450 135 L 468 180" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="440" y="125" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="11" fill="#059669" font-weight="600">window</text>

  <!-- Arrow: Box 4 -> State S_t (with "align" label) -->
  <path d="M 425 345 L 450 345 L 468 300" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="440" y="360" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="11" fill="#059669" font-weight="600">align</text>

  <!-- ==================== COLUMN 3: COMBINED STATE S_t ==================== -->
  <!-- Box 5: State S_t -->
  <g transform="translate(470, 140)">
    <rect width="185" height="200" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/>
    <text x="92" y="38" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="17" font-weight="bold" fill="#064e3b" text-anchor="middle">State S_t (10 s)</text>
    <text x="92" y="68" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="12" fill="#047857" font-weight="600" text-anchor="middle">27 Joint Invariants:</text>
    <text x="92" y="92" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="11.5" fill="#334155" text-anchor="middle">11 flow-level features</text>
    <text x="92" y="112" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="11.5" fill="#334155" text-anchor="middle">+ 6 TCP flag ratios</text>
    <text x="92" y="132" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="11.5" fill="#334155" text-anchor="middle">+ 10 packet metrics</text>
    <text x="92" y="152" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="11.5" fill="#64748b" text-anchor="middle">(incl. East-West &amp; entropy)</text>
    <rect x="22" y="165" width="141" height="22" rx="4" fill="#10b981" fill-opacity="0.2"/>
    <text x="92" y="180" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="11" font-weight="bold" fill="#065f46" text-anchor="middle">Vector S_t ∈ ℝ²⁷</text>
  </g>

  <!-- Arrow: State S_t -> World model -->
  <line x1="655" y1="240" x2="695" y2="240" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- ==================== COLUMN 4: WORLD MODEL (PURPLE CONTAINER) ==================== -->
  <g transform="translate(695, 45)">
    <!-- Container Box -->
    <rect width="240" height="390" rx="14" fill="#faf5ff" stroke="#6366f1" stroke-width="2.5"/>
    <text x="120" y="32" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="17" font-weight="bold" fill="#3730a3" text-anchor="middle">World model</text>

    <!-- Sub-box A: Encoder -->
    <g transform="translate(18, 48)">
      <rect width="204" height="68" rx="8" fill="#ffffff" stroke="#818cf8" stroke-width="1.8"/>
      <text x="102" y="24" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#1e1b4b" text-anchor="middle">Encoder q(z_t | S_t)</text>
      <text x="102" y="46" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="11" fill="#4f46e5" text-anchor="middle">Gaussian latent state / Embedding</text>
    </g>

    <!-- Sub-box B: Memory -->
    <g transform="translate(18, 128)">
      <rect width="204" height="68" rx="8" fill="#ffffff" stroke="#818cf8" stroke-width="1.8"/>
      <text x="102" y="24" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#1e1b4b" text-anchor="middle">Attention memory h_t</text>
      <text x="102" y="46" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="11" fill="#4f46e5" text-anchor="middle">temporal context (t-9 ... t)</text>
    </g>

    <!-- Sub-box C: Prior -->
    <g transform="translate(18, 208)">
      <rect width="204" height="68" rx="8" fill="#ffffff" stroke="#818cf8" stroke-width="1.8"/>
      <text x="102" y="24" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#1e1b4b" text-anchor="middle">Prior p(z_t+1 | h_t+1)</text>
      <text x="102" y="46" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="11" fill="#4f46e5" text-anchor="middle">learned transition dynamics</text>
    </g>

    <!-- Sub-box D: Decoder -->
    <g transform="translate(18, 288)">
      <rect width="204" height="74" rx="8" fill="#ffffff" stroke="#818cf8" stroke-width="1.8"/>
      <text x="102" y="24" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#1e1b4b" text-anchor="middle">Decoder p(S | z)</text>
      <text x="102" y="44" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="11" fill="#4f46e5" text-anchor="middle">reconstructs state S &amp; manifold</text>
      <text x="102" y="60" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="10.5" fill="#64748b" text-anchor="middle">ΔS divergence for zero-days</text>
    </g>
  </g>

  <!-- Arrow: World model -> Forecast (with "imagine" label) -->
  <line x1="935" y1="135" x2="975" y2="135" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="955" y="123" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="11" fill="#6366f1" font-weight="600" text-anchor="middle">imagine</text>

  <!-- Arrow: World model -> Explain + Alert (with "gradients" label) -->
  <line x1="935" y1="345" x2="975" y2="345" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="955" y="333" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="11" fill="#6366f1" font-weight="600" text-anchor="middle">gradients</text>

  <!-- ==================== COLUMN 5: FORECAST & EXPLAIN (ORANGE / PEACH) ==================== -->
  <!-- Box 7: K-step forecast -->
  <g transform="translate(975, 45)">
    <rect width="205" height="180" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2.5"/>
    <text x="102" y="34" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="16" font-weight="bold" fill="#7c2d12" text-anchor="middle">K-step forecast</text>
    <text x="102" y="62" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="12" fill="#9a3412" font-weight="600" text-anchor="middle">32-64 Monte-Carlo rollouts</text>
    <text x="102" y="84" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="12" fill="#334155" text-anchor="middle">P(infiltration) per window</text>
    <text x="102" y="104" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="12" fill="#334155" text-anchor="middle">+ 95% epistemic CI band</text>
    <text x="102" y="126" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="12" fill="#c2410c" font-weight="600" text-anchor="middle">MITRE ATT&amp;CK stages (0..5)</text>
    <text x="102" y="146" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Lead time: +48s to +54s</text>
  </g>

  <!-- Box 8: Explain + Alert -->
  <g transform="translate(975, 255)">
    <rect width="205" height="180" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2.5"/>
    <text x="102" y="32" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="16" font-weight="bold" fill="#7c2d12" text-anchor="middle">Explain + Alert</text>
    <text x="102" y="58" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="11.5" fill="#334155" text-anchor="middle">Integrated Gradients</text>
    <text x="102" y="76" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="11.5" fill="#334155" text-anchor="middle">&amp; Self-Attention heatmaps</text>
    <text x="102" y="96" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="11.5" fill="#9a3412" font-weight="600" text-anchor="middle">Counterfactual "What-If"</text>
    <text x="102" y="114" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="11" fill="#334155" text-anchor="middle">SMB block: 89% → 3% drop</text>
    <text x="102" y="134" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="11" fill="#334155" text-anchor="middle">Pre-deployment safety sandbox</text>
    <text x="102" y="152" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="11" fill="#047857" font-weight="600" text-anchor="middle">Automated eBPF / iptables</text>
  </g>

  <!-- ==================== BOTTOM HIGHLIGHT CAPTION ==================== -->
  <text x="600" y="485" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="14" font-weight="bold" fill="#db2777" text-anchor="middle">
    Offline dashboard: live timeline, forecast band, stage mix, attributions, flagged hosts &amp; flows, incident report | no cloud APIs
  </text>
</svg>
